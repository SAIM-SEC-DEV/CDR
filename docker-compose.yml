version: '3.8'

services:
  forge-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=development
      - READ_TIMEOUT=30s
      - WRITE_TIMEOUT=60s
      - MAX_UPLOAD_SIZE=52428800
      - TEMP_DIR=/tmp/forge
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
      - CLAMAV_USE_UNIX_SOCK=false
      - CLAMAV_TIMEOUT=30s
    depends_on:
      clamav:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ClamAV daemon for virus scanning
  clamav:
    image: clamav/clamav:stable
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=3310"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis placeholder for future async queue (Phase 2)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  clamav_data:
